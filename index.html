<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ordk — Heeye Choi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body { font-family:'Figtree','Helvetica Neue',Arial,sans-serif; font-weight:500; font-size:15px; line-height:1.3; color:#1a1a1a; background:#ebebeb; }
    :root { --cur: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2022.68%2022.45%22%3E%3Cpolygon%20points%3D%22.22%2011.22%2022.2%2022%2018.98%2011.22%2022.2%20.45%20.22%2011.22%22%2F%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M21.98%2C22.45L0%2C11.67v-.9L21.98%2C0l.7.59-3.18%2C10.63%2C3.18%2C10.63-.7.59ZM1.36%2C11.22l20.04%2C9.82-2.89-9.68v-.29l2.89-9.68L1.36%2C11.22Z%22%2F%3E%3C%2Fsvg%3E") 0 12, auto; }
    html, body { cursor: var(--cur); }
    a { color:inherit; text-decoration:none; }

    /* ══ HOME VIEW ══ */
    #home-view {
      position:fixed; inset:0; background:#ebebeb; z-index:10;
    }
    .r-corner { position:absolute; top:0; left:0; width:15px; height:15px; background:#ebebeb; border-right:1px solid #c0c0c0; border-bottom:1px solid #c0c0c0; z-index:20; }
    .r-top    { position:absolute; top:0; left:15px; right:0; height:15px; background:#ebebeb; border-bottom:1px solid #c0c0c0; z-index:15; cursor:s-resize; overflow:hidden; }
    .r-left   { position:absolute; top:15px; left:0; width:15px; bottom:0; background:#ebebeb; border-right:1px solid #c0c0c0; z-index:15; cursor:e-resize; overflow:hidden; }

    #guide-layer { position:absolute; inset:0; z-index:10; pointer-events:none; }
    .guide { position:absolute; pointer-events:none; }
    .guide.h { left:0; right:0; height:1px; background:rgba(0,0,0,.55); }
    .guide.v { top:0; bottom:0; width:1px; background:rgba(0,0,0,.55); }
    .gprev { position:fixed; pointer-events:none; z-index:200; opacity:.7; }
    .gprev.h { left:0; right:0; height:1px; background:#1a1a1a; }
    .gprev.v { top:0; bottom:0; width:1px; background:#1a1a1a; }

    #canvas { position:absolute; top:15px; left:15px; right:0; bottom:0; }

    /* home content — single flow container */
    #home-block {
      position:absolute; top:23px; left:20px;
      cursor:grab; user-select:none; z-index:30;
      font-size:15px; line-height:1.5;
    }
    #home-block:active { cursor:grabbing; }
    #dt1 { font-weight:600; white-space:nowrap; }
    #dt2 { font-weight:500; width:calc(100vw - 40px); }
    .hidden-ink { color:#ebebeb; }
    #home-menu { font-weight:500; margin-top:0; }
    #home-menu a { display:block; color:#1a1a1a; text-decoration:none; cursor:var(--cur); }
    #home-menu a:hover { color:#888; }

    /* initial hidden for typing anim */
    #home-block { opacity:0; }
    #home-menu { opacity:0; }

    /* mouse trail images */
    .trail-img {
      position:absolute; pointer-events:auto; z-index:20;
      transform:translate(-50%,-50%);
      opacity:0; transition:opacity .22s ease;
      object-fit:cover; cursor:var(--cur);
    }
    .trail-img.visible { opacity:1; }
    .trail-img.kept { outline:none; }

    /* ══ DRAWER ══ */
    #drawer {
      position:fixed; left:0; right:0; bottom:0;
      height:85vh;
      background:rgba(255,255,255,.65);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      z-index:100;
      transform:translateY(100%);
      transition:transform .65s cubic-bezier(0.16,1,0.3,1);
      display:flex;
      flex-direction:row;
      overflow:hidden;
    }
    #drawer.open { transform:translateY(0); }

    /* Category col — 10% */
    #dr-cat {
      width:10vw; flex-shrink:0;
      padding:32px 20px 28px 35px;
      overflow-y:auto;
    }
    #dr-cat ul { list-style:none; }
    #dr-cat li { margin-bottom:1px; }
    #dr-cat a { display:block; padding:1px 0; font-size:13px; font-weight:500; color:#1a1a1a; cursor:var(--cur); }
    #dr-cat a.on { color:#1a1a1a; font-weight:600; }
    #dr-cat a:hover { color:#1a1a1a; }

    /* Project list col — 10% */
    #dr-plist {
      width:10vw; flex-shrink:0;
      padding:32px 16px 28px 0;
      overflow-y:auto;
    }
    #dr-plist ul { list-style:none; }
    #dr-plist li { margin-bottom:1px; }
    #dr-plist a { display:block; padding:1px 0; font-size:13px; font-weight:500; color:#1a1a1a; cursor:var(--cur); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #dr-plist a.on { font-weight:600; }
    #dr-plist a:hover { color:#888; }

    /* Project-list toggle — only visible in tablet/stacked layout */
    #dr-plist-toggle {
      display:none;
      align-items:center; gap:8px;
      width:100%; flex-shrink:0;
      padding:12px 32px 12px 35px;
      background:none; border:none; cursor:var(--cur);
      font-family:inherit; font-size:13px; font-weight:600;
      color:#1a1a1a; text-align:left;
      border-bottom:1px solid rgba(0,0,0,.06);
    }
    #dr-plist-toggle .pt-key { color:#aaa; font-weight:500; margin-right:2px; }
    #dr-plist-toggle .chev {
      margin-left:auto; font-size:10px; color:#888;
      transition:transform .25s ease;
    }
    #dr-plist-toggle.open .chev { transform:rotate(180deg); }

    /* Detail col — 80% */
    #dr-detail {
      flex:1; display:flex; flex-direction:row;
      overflow:hidden; position:relative;
    }

    /* Close button */
    #dr-close {
      position:absolute; top:22px; right:24px; z-index:10;
      font-family:inherit; font-size:44px; font-weight:500; line-height:1;
      background:none; border:none; cursor:var(--cur); color:#aaa; padding:0;
    }
    #dr-close:hover { color:#1a1a1a; }

    /* Info sub-col */
    #dr-info {
      width:22%; flex-shrink:0;
      padding:32px 20px 32px 24px;
      overflow-y:auto;
    }
    #dr-info .dr-title { font-size:13px; font-weight:600; margin-bottom:20px; line-height:1.4; }
    .dr-meta { margin-bottom:1px; font-size:13px; }
    .dr-key { color:#aaa; margin-right:4px; }

    /* Description sub-col (right) */
    #dr-desc {
      width:28%; flex-shrink:0;
      padding:32px 80px 32px 0;
      overflow-y:auto;
    }
    #dr-desc .dr-body-ko { font-size:13px; margin-bottom:14px; line-height:1.65; color:#1a1a1a; }
    #dr-desc .dr-tagline  { font-size:13px; font-style:italic; margin-bottom:10px; color:#444; }
    #dr-desc .dr-body-en  { font-size:13px; color:#888; line-height:1.65; }

    /* Images sub-col (center) */
    #dr-imgs {
      flex:1;
      overflow-y:auto;
      padding:0 32px 0 0;
      display:flex; flex-direction:column; gap:6px;
    }
    #dr-imgs::-webkit-scrollbar { display:none; }
    .dr-img-wrap { flex-shrink:0; position:relative; }
    .dr-img-wrap img {
      display:block; width:100%; height:auto;
      cursor:var(--cur); transition:opacity .15s;
    }
    .dr-img-wrap img:hover { opacity:.88; }
    .dr-cap {
      position:absolute; left:10px; bottom:10px;
      display:inline-block; max-width:calc(100% - 20px);
      background:rgba(20,20,20,.78); color:#fff;
      font-size:11px; line-height:1.4; letter-spacing:.01em;
      padding:4px 8px;
      opacity:0; transition:opacity .15s; pointer-events:none;
    }
    .dr-img-wrap:hover .dr-cap { opacity:1; }
    .dr-img-counter {
      padding:10px 0 4px;
      font-size:11px; color:#aaa; letter-spacing:.04em;
    }

    /* Lightbox */
    #lightbox {
      display:none; position:fixed; inset:0; z-index:1000;
      background:rgba(20,20,20,.55);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      cursor:none;
    }
    #lightbox.open { display:flex; align-items:center; justify-content:center; }
    .lb-inner { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    #lb-img { height:100vh; width:auto; max-width:100vw; object-fit:contain; display:block; pointer-events:none; user-select:none; -webkit-user-drag:none; }
    #lightbox, #lightbox * { user-select:none; }
    #lb-arrow {
      position:fixed; pointer-events:none; z-index:1002;
      transform:translate(-50%,-50%); display:none;
    }
    #lb-close {
      position:fixed; top:24px; right:32px; z-index:1001;
      background:none; border:none; color:rgba(255,255,255,.6);
      font-size:15px; font-family:inherit; cursor:var(--cur); padding:8px;
      transition:color .15s;
    }
    #lb-close:hover { color:#fff; }
    #lb-counter {
      position:fixed; bottom:28px; right:32px;
      font-size:15px; font-family:inherit; color:rgba(255,255,255,.65);
    }

    /* ══ ARCHIVE ══ */
    #archive {
      position:fixed; left:0; right:0; bottom:0;
      height:85vh;
      background:rgba(255,255,255,.65);
      backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      z-index:100;
      transform:translateY(100%);
      transition:transform .65s cubic-bezier(0.16,1,0.3,1);
      overflow-y:auto;
    }
    #archive.open { transform:translateY(0); }
    #archive::-webkit-scrollbar { display:none; }
    #ar-close {
      position:fixed; top:22px; right:24px; z-index:110;
      font-family:inherit; font-size:15px; font-weight:500; line-height:1;
      background:none; border:none; cursor:var(--cur); color:#888; padding:8px;
    }
    #ar-close:hover { color:#1a1a1a; }
    #archive-grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
      padding:64px 35px 40px;
    }
    .ar-cell { overflow:hidden; }
    .ar-cell img { display:block; width:100%; height:auto; }
    @media (max-width:768px) {
      #archive-grid { grid-template-columns:repeat(2,1fr); padding:56px 20px 32px; }
    }

    /* ══ RESPONSIVE ══ */
    /* ── TABLET: category on top, project list collapsible ── */
    @media (max-width:1350px) and (min-width:769px) {
      #drawer { flex-direction:column; }

      /* Close button — vertically centered on the category row */
      #dr-close {
        top:0; right:0; height:48px;
        padding:0 20px; font-size:32px; line-height:1;
        display:flex; align-items:center; justify-content:center;
      }

      /* Category — horizontal scroll row at top (equal top/bottom spacing) */
      #dr-cat {
        width:100%; flex-shrink:0; height:48px;
        display:flex; align-items:center;
        padding:0 64px 0 35px;
        overflow-x:auto; overflow-y:hidden;
        border-bottom:1px solid rgba(0,0,0,.06);
      }
      #dr-cat::-webkit-scrollbar { display:none; }
      #dr-cat ul { display:flex; flex-direction:row; gap:20px; white-space:nowrap; }
      #dr-cat li { margin:0; }

      /* Toggle button visible */
      #dr-plist-toggle { display:flex; }

      /* Project list — collapsible horizontal row (collapsed by default) */
      #dr-plist {
        width:100%; flex-shrink:0;
        max-height:0; opacity:0; padding:0 32px 0 35px;
        overflow:hidden;
        transition:max-height .3s ease, opacity .2s ease, padding .3s ease;
      }
      #dr-plist::-webkit-scrollbar { display:none; }
      #dr-plist.expanded {
        max-height:120px; opacity:1;
        padding:10px 32px 12px 35px;
        overflow-x:auto; overflow-y:hidden;
        border-bottom:1px solid rgba(0,0,0,.06);
      }
      #dr-plist ul { display:flex; flex-direction:row; gap:20px; white-space:nowrap; }
      #dr-plist li { margin:0; }
      #dr-plist a { white-space:nowrap; overflow:visible; text-overflow:clip; }

      /* Detail — remaining space; description wraps below images */
      #dr-detail {
        flex:1;
        flex-wrap:wrap;
        overflow-y:auto;
        align-content:flex-start;
      }
      #dr-imgs { flex:1; min-width:0; align-self:flex-start; }
      #dr-info { align-self:flex-start; padding-left:35px; }
      #dr-desc {
        width:100%;
        flex-shrink:0;
        padding:24px 32px 40px 35px;
        overflow-y:visible;
      }
    }


    @media (max-width:768px) {
      /* Homepage */
      #dt2 { width:calc(100vw - 32px); }

      /* Rulers thin on mobile */
      .r-top  { height:10px; }
      .r-left { width:10px; }
      .r-corner { width:10px; height:10px; }
      #canvas { top:10px; left:10px; }

      /* Drawer: full screen, stacked vertically */
      #drawer { height:100vh; height:100dvh; flex-direction:column; }

      /* Category — horizontal scroll row (equal top/bottom spacing) */
      #dr-cat {
        width:100%; flex-shrink:0; height:44px;
        display:flex; align-items:center;
        padding:0 52px 0 30px;
        overflow-x:auto; overflow-y:hidden;
        border-bottom:1px solid rgba(0,0,0,.06);
      }
      #dr-cat::-webkit-scrollbar { display:none; }
      #dr-cat ul { display:flex; flex-direction:row; gap:18px; white-space:nowrap; }
      #dr-cat li { margin:0; }

      /* Toggle button visible */
      #dr-plist-toggle { display:flex; padding:12px 20px 12px 30px; }

      /* Project list — collapsible horizontal row (collapsed by default) */
      #dr-plist {
        width:100%; flex-shrink:0;
        max-height:0; opacity:0; padding:0 20px 0 30px;
        overflow:hidden;
        transition:max-height .3s ease, opacity .2s ease, padding .3s ease;
      }
      #dr-plist::-webkit-scrollbar { display:none; }
      #dr-plist.expanded {
        max-height:120px; opacity:1;
        padding:8px 20px 10px 30px;
        overflow-x:auto; overflow-y:hidden;
        border-bottom:1px solid rgba(0,0,0,.06);
      }
      #dr-plist ul { display:flex; flex-direction:row; gap:20px; white-space:nowrap; }
      #dr-plist li { margin:0; }
      #dr-plist a { white-space:nowrap; overflow:visible; text-overflow:clip; }

      /* Detail — column */
      #dr-detail { flex:1; flex-direction:column; overflow-y:auto; overflow-x:hidden; }

      /* Info full width */
      #dr-info { width:100%; flex-shrink:0; padding:18px 20px 12px 30px; }
      #dr-info .dr-title { margin-bottom:10px; }

      /* Images — horizontal strip */
      #dr-imgs {
        width:100%; flex-shrink:0;
        flex-direction:row;
        overflow-x:auto; overflow-y:hidden;
        height:58vw; padding:0; gap:4px;
      }
      #dr-imgs::-webkit-scrollbar { display:none; }
      .dr-img-wrap { flex-shrink:0; height:100%; width:auto; }
      .dr-img-wrap img { width:auto; height:100%; object-fit:cover; }

      /* Description full width */
      #dr-desc { width:100%; flex-shrink:0; padding:14px 20px 48px 30px; }

      /* Close button — vertically centered on the category row,
         with a fade-to-white backing so scrolling category text
         doesn't show through behind the × */
      #dr-close {
        top:0; right:0; height:44px;
        padding:0 16px 0 28px; font-size:32px; line-height:1;
        display:flex; align-items:center; justify-content:flex-end;
        background:linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,.92) 55%);
      }

      /* Lightbox: touch-friendly */
      #lb-counter { font-size:13px; bottom:20px; }

      /* Mobile: drawer scrolls vertically */
      #dr-detail { overflow-y:auto; overflow-x:hidden; flex-direction:column; }
      #dr-info  { flex-shrink:0; }
      #dr-desc  { flex-shrink:0; }

      /* Images: JS-controlled single-image display */
      #dr-imgs {
        flex-direction:column;
        overflow:visible;
        height:auto;
        flex-shrink:0;
        gap:0;
      }
      .dr-img-wrap { display:none; width:100%; height:auto; }
      .dr-img-wrap.mob-active { display:block; }
      .dr-img-wrap img { width:100%; height:auto; display:block; object-fit:initial; }
    }
  </style>
</head>

/* ── RULERS ── */
function drawH(svg) {
  var w = svg.clientWidth, s = '';
  for (var x = 0; x <= w; x += 30) {
    var maj = x % 90 === 0, th = maj ? 8 : (x % 60 === 0 ? 5 : 3);
    s += '<line x1="'+x+'" y1="'+(15-th)+'" x2="'+x+'" y2="15" stroke="#b8b8b8" stroke-width=".5"/>';
  }
  svg.innerHTML = s;
}
function drawV(svg) {
  var h = svg.clientHeight, s = '';
  for (var y = 0; y <= h; y += 30) {
    var maj = y % 90 === 0, tw = maj ? 8 : (y % 60 === 0 ? 5 : 3);
    s += '<line x1="'+(15-tw)+'" y1="'+y+'" x2="15" y2="'+y+'" stroke="#b8b8b8" stroke-width=".5"/>';
  }
  svg.innerHTML = s;
}
window.addEventListener('load', function(){ drawH(document.getElementById('svg-top')); drawV(document.getElementById('svg-left')); });
window.addEventListener('resize', function(){ drawH(document.getElementById('svg-top')); drawV(document.getElementById('svg-left')); });

    if(e.target.tagName==='A') return;
    down=true; sx=e.clientX; sy=e.clientY;

function renderArchive() {

    img.src = '_web/Archive/' + file;

    grid.appendChild(cell);
  });

}

function filteredProjects() {
  if (currentFilter === 'all') return PROJECTS;
  return PROJECTS.filter(function(p){ return p.cats.indexOf(currentFilter) !== -1; });
}

function renderCatFilter() {
  document.querySelectorAll('.dr-cat-link').forEach(function(a){
    a.classList.toggle('on', a.dataset.cat === currentFilter);
  });
  // Show/hide project rows in list based on filter
  renderProjectList();
}

function renderProjectList() {
  var ul = document.getElementById('dr-plist-ul');
  ul.innerHTML = '';
  filteredProjects().forEach(function(p){
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.textContent = p.titleEn || p.title;
    a.dataset.id = p.id;
    if (p.id === currentProject) a.classList.add('on');
    a.addEventListener('click', function(){ loadProject(p.id); });
    li.appendChild(a);
    ul.appendChild(li);
  });
}

var plistEl = document.getElementById('dr-plist');

function setPlistOpen(open) {
  plistEl.classList.toggle('expanded', open);
  plistToggle.classList.toggle('open', open);
  plistToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
}

  setPlistOpen(!plistEl.classList.contains('expanded'));
});

function loadProject(id) {
  currentProject = id;
  var p = PROJECTS.find(function(x){ return x.id === id; });
  if (!p) return;

  // Update project list highlight
  document.querySelectorAll('#dr-plist-ul a').forEach(function(a){
    a.classList.toggle('on', a.dataset.id === id);
  });

  // Tablet toggle: show current title, then collapse the list
  var cur = document.getElementById('dr-plist-current');
  if (cur) cur.textContent = p.titleEn || p.title;
  setPlistOpen(false);

  // Info
  document.getElementById('dr-title').textContent = p.title;
  document.getElementById('dr-client').textContent = p.client;
  document.getElementById('dr-date').textContent = p.date;
  // Type (Commercial / Personal)
  var typeRow = document.getElementById('dr-type-row');
  var typeStr = p.type || '';
  document.getElementById('dr-type').textContent = typeStr;
  typeRow.style.display = typeStr ? '' : 'none';
  // Category (comma-joined)
  var catRow = document.getElementById('dr-cat-row');
  var catStr = (p.categories && p.categories.length) ? p.categories.join(', ') : '';
  document.getElementById('dr-cat-val').textContent = catStr;
  catRow.style.display = catStr ? '' : 'none';
  // Field (comma-joined)
  var fieldRow = document.getElementById('dr-field-row');
  var fieldStr = (p.fields && p.fields.length) ? p.fields.join(', ') : '';
  document.getElementById('dr-field').textContent = fieldStr;
  fieldRow.style.display = fieldStr ? '' : 'none';

  // Description
  document.getElementById('dr-body-ko').textContent = p.bodyKo;
  document.getElementById('dr-tagline').textContent = p.taglineEn;
  document.getElementById('dr-body-en').textContent = p.bodyEn;

  // Images — p.images[] (ratio/zoom/pos/bg) 우선, 없으면 기존 imgCount 폴백
  var imgs = document.getElementById('dr-imgs');
  imgs.innerHTML = '';
  var list = (p.images && p.images.length)
    ? p.images.map(function(im){ return { src: '_web/' + p.folder + '/' + im.file, s: im }; })
    : [];
  if (!list.length) {
    for (var i = 1; i <= p.imgCount; i++)
      list.push({ src: '_web/' + p.folder + '/' + String(i).padStart(3,'0') + '.jpg', s: null });
  }
  var allSrcs = list.map(function(x){ return x.src; });
  list.forEach(function(x, idx){
    var s = x.s || {};
    var wrap = document.createElement('div');
    wrap.className = 'dr-img-wrap';
    if (s.bg) wrap.style.background = s.bg;
    if (s.ratio && s.ratio !== 'original') {
      wrap.style.aspectRatio = s.ratio.replace(':', ' / ');
      wrap.style.overflow = 'hidden';
    }
    var img = document.createElement('img');
    img.src = x.src; img.alt = s.alt || '';
    if (s.ratio && s.ratio !== 'original') {
      img.style.width = '100%'; img.style.height = '100%';
      img.style.objectFit = 'contain';
      img.style.transform = 'translate(' + (s.posX||0) + '%,' + (s.posY||0) + '%) scale(' + (s.zoom||1) + ')';
    } else if (s.zoom && s.zoom !== 1 || s.posX || s.posY) {
      img.style.transform = 'translate(' + (s.posX||0) + '%,' + (s.posY||0) + '%) scale(' + (s.zoom||1) + ')';
    }
    (function(i2, srcs){ img.addEventListener('click', function(){ lbOpen(srcs, i2); }); })(idx, allSrcs);
    wrap.appendChild(img);
    // Hover caption — only when alt/caption exists
    if (s.alt) {
      var cap = document.createElement('span');
      cap.className = 'dr-cap';
      cap.textContent = s.alt;
      wrap.appendChild(cap);
    }
    imgs.appendChild(wrap);
  });
  imgs.scrollTop = 0;
  initMobileCarousel();
}

var SVG_L = '<svg width="36" height="64" viewBox="0 0 36 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M30 2L6 32L30 62" stroke="#1a1a1a" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"/></svg>';

var mobImgIdx = 0;
function isMobile() { return window.innerWidth <= 768; }

function mobShowImg(idx) {
  var wraps = document.querySelectorAll('#dr-imgs .dr-img-wrap');
  if (!wraps.length) return;
  mobImgIdx = (idx + wraps.length) % wraps.length;
  wraps.forEach(function(w, i) { w.classList.toggle('mob-active', i === mobImgIdx); });
}

function initMobileCarousel() {
  if (!isMobile()) return;
  mobImgIdx = 0;
  mobShowImg(0);
}

/* Keep carousel state valid when resizing across the mobile breakpoint.
   Without this, a drawer opened at desktop width has no .mob-active wrap,
   so shrinking to mobile hides every image (display:none). */
window.addEventListener('resize', function(){
  var wraps = document.querySelectorAll('#dr-imgs .dr-img-wrap');
  if (!wraps.length) return;
  if (isMobile()) {
    if (!document.querySelector('#dr-imgs .dr-img-wrap.mob-active')) mobShowImg(mobImgIdx || 0);
  } else {
    wraps.forEach(function(w){ w.classList.remove('mob-active'); });
  }
});

var drImgsEl = document.getElementById('dr-imgs');
var mobTouchX = 0, mobTouchY = 0, mobDir = null;

drImgsEl.addEventListener('touchstart', function(e){
  mobTouchX = e.touches[0].clientX;
  mobTouchY = e.touches[0].clientY;
  mobDir = null;
}, {passive:true});

drImgsEl.addEventListener('touchmove', function(e){
  if (!isMobile()) return;
  var dx = Math.abs(e.touches[0].clientX - mobTouchX);
  var dy = Math.abs(e.touches[0].clientY - mobTouchY);
  if (!mobDir) mobDir = dx > dy ? 'h' : 'v';
  if (mobDir === 'h') e.preventDefault();
}, {passive:false});

drImgsEl.addEventListener('touchend', function(e){
  if (!isMobile() || mobDir !== 'h') return;
  var dx = e.changedTouches[0].clientX - mobTouchX;
  if (Math.abs(dx) > 30) mobShowImg(mobImgIdx + (dx < 0 ? 1 : -1));
}, {passive:true});

/* Touch swipe for lightbox */
var lbTouchX = 0;
lb.addEventListener('touchstart', function(e){ lbTouchX = e.touches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', function(e){
  var dx = e.changedTouches[0].clientX - lbTouchX;
  if (Math.abs(dx) > 40) dx < 0 ? lbShow(lbCur+1) : lbShow(lbCur-1);
}, {passive:true});

/* Touch drag scroll for image strips */
document.querySelectorAll('.strip, #dr-imgs').forEach(function(el){
  var tx=0, sl=0, dragging=false;
  el.addEventListener('touchstart', function(e){ tx=e.touches[0].clientX; sl=el.scrollLeft; dragging=true; },{passive:true});
  el.addEventListener('touchmove', function(e){ if(!dragging)return; el.scrollLeft=sl-(e.touches[0].clientX-tx); },{passive:true});
  el.addEventListener('touchend', function(){ dragging=false; },{passive:true});
});

/* ── TYPING ANIMATION ── */
window.addEventListener('load', function(){
  var SPEED = 7; // ms per char

  // dt1 chars — hidden-ink chars wrapped in {h:'x'}
  var dt1Chars = [
    'O','R','D','K',',',' ','o','r','d','e','r',
    {h:'k'},
    'n','a','c',
    {h:'k'}
  ];

  function typeCustom(el, chars, spd, done) {
    el.style.opacity = '1';
    el.innerHTML = '';
    var i = 0;
    function step() {
      if (i >= chars.length) { if (done) done(); return; }
      var c = chars[i++];
      if (c && typeof c === 'object') {
        var sp = document.createElement('span');
        sp.className = 'hidden-ink'; sp.textContent = c.h;
        el.appendChild(sp);
      } else {
        el.appendChild(document.createTextNode(c));
      }
      setTimeout(step, spd);
    }
    step();
  }

  function typeText(el, text, spd, done) {
    el.style.opacity = '1';
    el.innerHTML = '';
    var i = 0;
    function step() {
      if (i >= text.length) { if (done) done(); return; }
      var ch = text[i++];
      if (ch === '\n') {
        el.appendChild(document.createElement('br'));
      } else {
        var last = el.lastChild;
        if (last && last.nodeType === 3) { last.textContent += ch; }
        else { el.appendChild(document.createTextNode(ch)); }
      }
      setTimeout(step, spd);
    }
    step();
  }

  var block = document.getElementById('home-block');
  var dt1 = document.getElementById('dt1');
  var dt2 = document.getElementById('dt2');
  var menu = document.getElementById('home-menu');

  setTimeout(function(){
    block.style.opacity = '1';
    typeCustom(dt1, dt1Chars, SPEED * 2, function(){
      typeText(dt2,
        'ordk is a designer who assembles messages into visual systems. Working across branding, graphic, and visual design, ordk builds structured and intentional identities grounded in real-world context and hands-on experience.\nMove your mouse. Click to keep the moment.',
        SPEED, function(){
          menu.style.transition = 'opacity .5s';
          menu.style.opacity = '1';
        });
    });
  }, 300);
});

/* ── MOUSE TRAIL IMAGES ── */
(function(){
  var pool = [
    '_web/Hotel GOYO/001.jpg','_web/Hotel GOYO/002.jpg','_web/Hotel GOYO/003.jpg',
    '_web/Hotel GOYO/005.jpg','_web/Hotel GOYO/007.jpg','_web/Hotel GOYO/009.jpg',
    '_web/dotdotdot/001.jpg','_web/dotdotdot/002.jpg','_web/dotdotdot/003.jpg',
    '_web/dotdotdot/005.jpg','_web/dotdotdot/007.jpg'
  ];

  function shuffle(a) {
    var b = a.slice();
    for (var i = b.length-1; i > 0; i--) {
      var j = Math.floor(Math.random()*(i+1)), t = b[i]; b[i]=b[j]; b[j]=t;
    }
    return b;
  }

  var deck = shuffle(pool), deckIdx = 0;
  function nextSrc() {
    if (deckIdx >= deck.length) { deck = shuffle(pool); deckIdx = 0; }
    return deck[deckIdx++];
  }

  var lastX = -9999, lastY = -9999;
  var MIN_DIST = 160;
  var LIFE = 1000; // ms before fade

  document.getElementById('home-view').addEventListener('mousemove', function(e) {
    if (document.getElementById('drawer').classList.contains('open')) return;

    var canvas = document.getElementById('canvas');
    var r = canvas.getBoundingClientRect();
    var cx = e.clientX - r.left;
    var cy = e.clientY - r.top;

    // exclude left text/menu zone
    if (cx < 320) return;

    var d = Math.sqrt((cx-lastX)*(cx-lastX)+(cy-lastY)*(cy-lastY));
    if (d < MIN_DIST) return;
    lastX = cx; lastY = cy;

    var w = 160 + Math.floor(Math.random()*100); // 160-260px
    var rot = (Math.random()*8 - 4).toFixed(1);  // -4° to +4°

    var img = document.createElement('img');
    img.className = 'trail-img';
    img.src = nextSrc();
    img.style.left = cx + 'px';
    img.style.top  = cy + 'px';
    img.style.width = w + 'px';
    img.style.transform = 'translate(-50%,-50%) rotate('+rot+'deg)';
    canvas.appendChild(img);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ img.classList.add('visible'); });
    });

    var kept = false;
    var fadeTimer = setTimeout(function(){
      if (kept) return;
      img.style.transition = 'opacity .45s ease';
      img.classList.remove('visible');
      setTimeout(function(){ if (img.parentNode) img.parentNode.removeChild(img); }, 450);
    }, LIFE);

    img.addEventListener('click', function(e) {
      e.stopPropagation();
      kept = true;
      clearTimeout(fadeTimer);
      img.style.transition = 'none';
      img.style.opacity = '1';
      img.classList.add('kept');
    });
  });
})();

/* ── EMAIL: copy address to clipboard ── */
(function(){
  var el = document.getElementById('email-copy');
  if (!el) return;
  var LABEL = el.textContent;
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
  }
  function feedback(){
    el.textContent = 'copied!';
    clearTimeout(el._resetT);
    el._resetT = setTimeout(function(){ el.textContent = LABEL; }, 1200);
  }
  el.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    var addr = el.dataset.email;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(addr).then(feedback, function(){ fallbackCopy(addr); feedback(); });
    } else {
      fallbackCopy(addr); feedback();
    }
  });
})();
