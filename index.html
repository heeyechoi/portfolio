<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ordk — Heeye Choi</title>
  <link rel="icon" type="image/png" href="fav.png">
  <link rel="apple-touch-icon" href="fav.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body { font-family:'Figtree','Helvetica Neue',Arial,sans-serif; font-weight:500; font-size:15px; line-height:1.3; color:#1a1a1a; background:#ebebeb; word-break:keep-all; overflow-wrap:normal; }
    :root { --cur: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'33.2'%20height%3D'33.2'%20viewBox%3D'-5%20-5%2033%2033'%3E%3Cg%20transform%3D'rotate(45%2011.34%2011.225)'%3E%3Cpolygon%20points%3D'.22%2011.22%2022.2%2022%2018.98%2011.22%2022.2%20.45%20.22%2011.22'%2F%3E%3Cpath%20fill%3D'%23fff'%20d%3D'M21.98%2C22.45L0%2C11.67v-.9L21.98%2C0l.7.59-3.18%2C10.63%2C3.18%2C10.63-.7.59ZM1.36%2C11.22l20.04%2C9.82-2.89-9.68v-.29l2.89-9.68L1.36%2C11.22Z'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") 8 8, auto;
      --cur-left: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'22.8'%20height%3D'22.8'%20viewBox%3D'0%200%2022.68%2022.45'%3E%3Cpolygon%20points%3D'.22%2011.22%2022.2%2022%2018.98%2011.22%2022.2%20.45%20.22%2011.22'%2F%3E%3Cpath%20fill%3D'%23fff'%20d%3D'M21.98%2C22.45L0%2C11.67v-.9L21.98%2C0l.7.59-3.18%2C10.63%2C3.18%2C10.63-.7.59ZM1.36%2C11.22l20.04%2C9.82-2.89-9.68v-.29l2.89-9.68L1.36%2C11.22Z'%2F%3E%3C%2Fsvg%3E") 0 11, auto;
      --cur-right: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'22.8'%20height%3D'22.8'%20viewBox%3D'0%200%2022.68%2022.45'%3E%3Cg%20transform%3D'translate(22.68%2C0)%20scale(-1%2C1)'%3E%3Cpolygon%20points%3D'.22%2011.22%2022.2%2022%2018.98%2011.22%2022.2%20.45%20.22%2011.22'%2F%3E%3Cpath%20fill%3D'%23fff'%20d%3D'M21.98%2C22.45L0%2C11.67v-.9L21.98%2C0l.7.59-3.18%2C10.63%2C3.18%2C10.63-.7.59ZM1.36%2C11.22l20.04%2C9.82-2.89-9.68v-.29l2.89-9.68L1.36%2C11.22Z'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") 22 11, auto;
      --cur-drag: url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'22.8'%20height%3D'22.8'%20viewBox%3D'0%200%2022.8%2022.8'%3E%3Ccircle%20cx%3D'11.4'%20cy%3D'11.4'%20r%3D'9.4'%20fill%3D'none'%20stroke%3D'%23fff'%20stroke-width%3D'3'%2F%3E%3Ccircle%20cx%3D'11.4'%20cy%3D'11.4'%20r%3D'9.4'%20fill%3D'none'%20stroke%3D'%23000'%20stroke-width%3D'1.2'%2F%3E%3C%2Fsvg%3E") 11 11, auto; }
    html, body { cursor: var(--cur); }
    a { color:inherit; text-decoration:none; }

    /* ══ HOME VIEW ══ */
    #home-view {
      position:fixed; inset:0; background:#ebebeb; z-index:10;
    }
    .r-corner { position:absolute; top:0; left:0; width:15px; height:15px; background:#ebebeb; border-right:1px solid #c0c0c0; border-bottom:1px solid #c0c0c0; z-index:20; }
    .r-top    { position:absolute; top:0; left:15px; right:0; height:15px; background:#ebebeb; border-bottom:1px solid #c0c0c0; z-index:15; cursor:s-resize; overflow:hidden; }
    .r-left   { position:absolute; top:15px; left:0; width:15px; bottom:0; background:#ebebeb; border-right:1px solid #c0c0c0; z-index:15; cursor:e-resize; overflow:hidden; }

    #guide-layer { position:absolute; inset:0; z-index:10; pointer-events:none; }
    .guide { position:absolute; pointer-events:none; }
    .guide.h { left:0; right:0; height:1px; background:rgba(0,0,0,.55); }
    .guide.v { top:0; bottom:0; width:1px; background:rgba(0,0,0,.55); }
    .gprev { position:fixed; pointer-events:none; z-index:200; opacity:.7; }
    .gprev.h { left:0; right:0; height:1px; background:#1a1a1a; }
    .gprev.v { top:0; bottom:0; width:1px; background:#1a1a1a; }

    #canvas { position:absolute; top:15px; left:15px; right:0; bottom:0; }

    /* home content — single flow container */
    #home-block {
      position:absolute; top:23px; left:20px;
      cursor:var(--cur); user-select:none; z-index:30;
      font-size:15px; line-height:1.5;
    }
    #dt1 { font-weight:600; white-space:nowrap; }
    #dt2 { font-weight:500; width:calc(100vw - 40px); }
    .hidden-ink { color:#ebebeb; }
    #home-menu { font-weight:500; margin-top:0; }
    #home-menu a { display:inline-block; color:#1a1a1a; text-decoration:none; cursor:var(--cur); }
    #home-menu a:hover { color:#888; }
    #home-block .word { display:inline-block; }
    #home-block .word, #home-menu a { cursor:grab; }
    #home-block .word:active, #home-menu a:active { cursor:grabbing; }

    /* initial hidden for typing anim */
    #home-block { opacity:0; }
    #home-menu { opacity:0; }

    /* mouse trail images */
    .trail-img {
      position:absolute; pointer-events:auto; z-index:20;
      transform:translate(-50%,-50%);
      opacity:0; transition:opacity .22s ease;
      object-fit:cover; cursor:var(--cur);
    }
    .trail-img.visible { opacity:1; }
    .trail-img.kept { outline:none; }

    /* ══ DRAWER ══ */
    #drawer {
      position:fixed; left:0; right:0; bottom:0;
      height:85vh;
      background:rgba(255,255,255,.65);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
      z-index:100;
      transform:translateY(100%);
      transition:transform .65s cubic-bezier(0.16,1,0.3,1);
      display:flex;
      flex-direction:row;
      overflow:hidden;
    }
    #drawer.open { transform:translateY(0); }

    /* Category col — 10% */
    #dr-cat {
      width:10vw; flex-shrink:0;
      padding:32px 20px 28px 35px;
      overflow-y:auto;
    }
    #dr-cat ul { list-style:none; }
    #dr-cat li { margin-bottom:1px; }
    #dr-cat a { display:block; padding:1px 0; font-size:14px; font-weight:500; color:#1a1a1a; cursor:var(--cur); }
    #dr-cat a.on { color:#1a1a1a; font-weight:600; }
    #dr-cat a:hover { color:#1a1a1a; }

    /* Project list col — 10% */
    #dr-plist {
      width:10vw; flex-shrink:0;
      padding:32px 16px 28px 0;
      overflow-y:auto;
    }
    #dr-plist ul { list-style:none; }
    #dr-plist li { margin-bottom:1px; }
    #dr-plist a { display:block; padding:1px 0; font-size:14px; font-weight:500; color:#1a1a1a; cursor:var(--cur); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #dr-plist a.on { font-weight:600; }
    #dr-plist a:hover { color:#888; }

    /* Project-list toggle — only visible in tablet/stacked layout */
    #dr-plist-toggle {
      display:none;
      align-items:center; gap:8px;
      width:100%; flex-shrink:0;
      padding:12px 32px 12px 35px;
      background:none; border:none; cursor:var(--cur);
      font-family:inherit; font-size:14px; font-weight:600;
      color:#1a1a1a; text-align:left;
      border-bottom:1px solid rgba(0,0,0,.06);
    }
    #dr-plist-toggle .pt-key { color:#aaa; font-weight:500; margin-right:2px; }
    #dr-plist-toggle .chev {
      margin-left:auto; font-size:10px; color:#888;
      transition:transform .25s ease;
    }
    #dr-plist-toggle.open .chev { transform:rotate(180deg); }

    /* Detail col — 80% */
    /* Main area — index (list) + detail, toggled by mode */
    #dr-main { flex:1; position:relative; overflow:hidden; }
    #dr-topbtn {
      position:absolute; top:32px; right:35px; z-index:10;
      font-family:inherit; font-size:15px; font-weight:500; line-height:1;
      background:none; border:none; padding:6px;
      color:#fff; mix-blend-mode:difference;   /* inverts against whatever is behind */
      cursor:var(--cur);
    }
    #dr-topbtn:hover { opacity:.7; }
    #dr-list, #dr-detail { height:100%; overflow-y:auto; padding:32px 35px 48px; }
    #dr-list::-webkit-scrollbar, #dr-detail::-webkit-scrollbar { display:none; }
    #dr-main.mode-list #dr-detail { display:none; }
    #dr-main.mode-detail #dr-list { display:none; }

    /* Index cards (image-led 목차) */
    .dl-card { margin-bottom:64px; cursor:var(--cur); }
    .dl-card:last-child { margin-bottom:8px; }
    .dl-strip {
      display:flex; gap:6px; height:44vh;
      overflow:hidden; scroll-behavior:smooth;
    }
    .dl-strip.dv-strip { height:62vh; margin-bottom:16px; }   /* ~half the top padding */
    .dl-strip::-webkit-scrollbar { display:none; }
    .dl-track { display:flex; gap:6px; height:100%; width:max-content; will-change:transform; }
    /* 목차 스트립: 네이티브 커서 숨기고 아래 #dragdot 을 커서로 사용 */
    .dl-strip:not(.dv-strip) { cursor:none; }
    #dragdot {
      position:absolute; display:none; z-index:12;
      width:18px; height:18px; border-radius:50%;
      background:#fff; mix-blend-mode:difference;   /* inverts against whatever is behind */
      transform:translate(-50%,-50%); pointer-events:none;
    }
    #dragdot.pressed { background:#ff2a2a; mix-blend-mode:normal; }   /* red while clicking/dragging */
    .dl-cell { flex:0 0 auto; height:100%; }
    .dl-cell img { display:block; height:100%; width:auto; object-fit:cover; pointer-events:none; -webkit-user-drag:none; user-select:none; }
    .dl-meta {
      display:grid; grid-template-columns:1.4fr 1fr 1fr 2.2fr; gap:20px;
      margin-top:14px; font-size:14px; color:#1a1a1a;
    }
    .dl-title { font-weight:600; }
    .dl-td { white-space:pre-line; }

    /* Detail view */
    .dv-imgs { display:flex; flex-direction:column; gap:6px; }
    .dv-imgs-top { margin-bottom:28px; }
    .dv-imgs-rest { margin-top:28px; }
    .dv-head {
      display:grid; grid-template-columns:1.4fr 1fr 1.3fr 1fr 1.2fr; gap:20px;
      margin-bottom:24px;
    }
    .dv-title { font-size:14px; font-weight:600; margin-bottom:16px; line-height:1.4; }
    .dv-typedate { font-size:14px; white-space:pre-line; line-height:1.5; }
    .dv-k { font-size:14px; font-weight:600; margin-bottom:10px; }
    .dv-v { font-size:14px; line-height:1.5; }
    .dv-credit-line { margin-bottom:2px; }
    .dr-credit-link { color:#1a1a1a; text-decoration:underline; text-underline-offset:2px; cursor:var(--cur); }
    .dr-credit-link:hover { color:#888; }
    /* Description left-aligned with the Client column (same grid as .dv-head, start at col 2) */
    .dv-desc { display:grid; grid-template-columns:1.4fr 1fr 1.3fr 1fr 1.2fr; gap:0 20px; margin-bottom:8px; }
    .dv-desc > * { grid-column:2 / 5; }   /* right edge at the col4/col5 boundary */
    .dv-body-ko { font-size:14px; line-height:1.5; margin-bottom:16px; }
    .dv-tagline { font-size:14px; font-style:italic; color:#444; margin-bottom:12px; }
    .dv-body-en { font-size:14px; line-height:1.3; color:#333; }
    .dr-img-wrap { flex-shrink:0; position:relative; }
    .dr-img-wrap img {
      display:block; width:100%; height:auto;
      cursor:var(--cur); transition:opacity .15s;
    }
    .dr-img-wrap img:hover { opacity:.88; }
    .dr-cap {
      position:absolute; left:0; top:0;
      transform:translate(-50%,-100%); margin-top:-12px;
      display:inline-block; max-width:220px;
      background:rgba(20,20,20,.78); color:#fff;
      font-size:11px; line-height:1.4; letter-spacing:.01em;
      padding:4px 8px;
      opacity:0; transition:opacity .12s; pointer-events:none; z-index:6;
    }
    .dr-img-wrap:hover .dr-cap { opacity:1; }

    /* Lightbox */
    #lightbox {
      display:none; position:fixed; inset:0; z-index:1000;
      background:rgba(20,20,20,.55);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      cursor:none;
    }
    #lightbox.open { display:flex; align-items:center; justify-content:center; }
    .lb-inner { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    #lb-img { height:100vh; width:auto; max-width:100vw; object-fit:contain; display:block; pointer-events:none; user-select:none; -webkit-user-drag:none; }
    #lightbox, #lightbox * { user-select:none; }
    #lb-arrow {
      position:fixed; pointer-events:none; z-index:1002;
      transform:translate(-50%,-50%); display:none;
    }
    #lb-close {
      position:fixed; top:24px; right:32px; z-index:1001;
      background:none; border:none; color:rgba(255,255,255,.6);
      font-size:15px; font-family:inherit; cursor:var(--cur); padding:8px;
      transition:color .15s;
    }
    #lb-close:hover { color:#fff; }
    #lb-counter {
      position:fixed; bottom:28px; right:32px;
      font-size:15px; font-family:inherit; color:rgba(255,255,255,.65);
    }

    /* ══ ARCHIVE ══ */
    #archive {
      position:fixed; left:0; right:0; bottom:0;
      height:85vh;
      background:rgba(255,255,255,.65);
      backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
      z-index:100;
      transform:translateY(100%);
      transition:transform .65s cubic-bezier(0.16,1,0.3,1);
      overflow-y:auto;
    }
    #archive.open { transform:translateY(0); }
    #archive::-webkit-scrollbar { display:none; }
    #ar-close {
      position:fixed; top:22px; right:24px; z-index:110;
      font-family:inherit; font-size:15px; font-weight:500; line-height:1;
      background:none; border:none; cursor:var(--cur); color:#888; padding:8px;
    }
    #ar-close:hover { color:#1a1a1a; }
    #archive-grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
      padding:64px 35px 40px;
    }
    .ar-cell { overflow:hidden; }
    .ar-cell img { display:block; width:100%; height:auto; }
    @media (max-width:768px) {
      #archive-grid { grid-template-columns:repeat(2,1fr); padding:56px 20px 32px; }
    }

    /* ══ ABOUT ══ (same panel as Archive) */
    #about {
      position:fixed; left:0; right:0; bottom:0;
      height:85vh;
      background:rgba(255,255,255,.65);
      backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
      z-index:100;
      transform:translateY(100%);
      transition:transform .65s cubic-bezier(0.16,1,0.3,1);
      overflow-y:auto;
    }
    #about.open { transform:translateY(0); }
    #about::-webkit-scrollbar { display:none; }
    #ab-close {
      position:fixed; top:22px; right:24px; z-index:110;
      font-family:inherit; font-size:15px; font-weight:500; line-height:1;
      background:none; border:none; cursor:var(--cur); color:#888; padding:8px;
    }
    #ab-close:hover { color:#1a1a1a; }
    #about-body {
      padding:64px 35px 40px;
      max-width:760px;
      font-size:15px; font-weight:500; line-height:1.7;
      white-space:pre-wrap; word-break:keep-all; overflow-wrap:normal;
    }
    @media (max-width:768px) {
      #about-body { padding:56px 20px 32px; }
    }

    /* ══ RESPONSIVE ══ */
    /* ── TABLET: category on top, project list collapsible ── */
    @media (max-width:1350px) and (min-width:769px) {
      #drawer { flex-direction:column; }

      /* Top button (Close / Back to List) */
      #dr-topbtn { top:10px; right:16px; }

      /* Category — horizontal scroll row at top (equal top/bottom spacing) */
      #dr-cat {
        width:100%; flex-shrink:0; height:48px;
        display:flex; align-items:center;
        padding:0 64px 0 35px;
        overflow-x:auto; overflow-y:hidden;
        border-bottom:1px solid rgba(0,0,0,.06);
      }
      #dr-cat::-webkit-scrollbar { display:none; }
      #dr-cat ul { display:flex; flex-direction:row; gap:20px; white-space:nowrap; }
      #dr-cat li { margin:0; }

      /* Toggle button visible */
      #dr-plist-toggle { display:flex; }

      /* Project list — collapsible horizontal row (collapsed by default) */
      #dr-plist {
        width:100%; flex-shrink:0;
        max-height:0; opacity:0; padding:0 32px 0 35px;
        overflow:hidden;
        transition:max-height .3s ease, opacity .2s ease, padding .3s ease;
      }
      #dr-plist::-webkit-scrollbar { display:none; }
      #dr-plist.expanded {
        max-height:120px; opacity:1;
        padding:10px 32px 12px 35px;
        overflow-x:auto; overflow-y:hidden;
        border-bottom:1px solid rgba(0,0,0,.06);
      }
      #dr-plist ul { display:flex; flex-direction:row; gap:20px; white-space:nowrap; }
      #dr-plist li { margin:0; }
      #dr-plist a { white-space:nowrap; overflow:visible; text-overflow:clip; }

      /* Main fills remaining height */
      #dr-main { flex:1; min-height:0; }
      #dr-list, #dr-detail { padding:44px 32px 40px 35px; }
      .dl-strip { height:38vh; }
      .dl-meta { grid-template-columns:1fr 1fr; gap:8px 20px; }
      .dl-meta .dl-cats { grid-column:1 / -1; }
      .dv-head { grid-template-columns:1fr 1fr 1fr; gap:16px; }
      .dv-title-col { grid-column:1 / -1; }
      .dv-desc { display:block; }
    }


    @media (max-width:768px) {
      /* Homepage */
      #dt2 { width:calc(100vw - 32px); }

      /* Rulers thin on mobile */
      .r-top  { height:10px; }
      .r-left { width:10px; }
      .r-corner { width:10px; height:10px; }
      #canvas { top:10px; left:10px; }

      /* Drawer: full screen, stacked vertically */
      #drawer { height:100vh; height:100dvh; flex-direction:column; }

      /* Category — horizontal scroll row (equal top/bottom spacing) */
      #dr-cat {
        width:100%; flex-shrink:0; height:44px;
        display:flex; align-items:center;
        padding:0 52px 0 30px;
        overflow-x:auto; overflow-y:hidden;
        border-bottom:1px solid rgba(0,0,0,.06);
      }
      #dr-cat::-webkit-scrollbar { display:none; }
      #dr-cat ul { display:flex; flex-direction:row; gap:18px; white-space:nowrap; }
      #dr-cat li { margin:0; }

      /* Toggle button visible */
      #dr-plist-toggle { display:flex; padding:12px 20px 12px 30px; }

      /* Project list — collapsible horizontal row (collapsed by default) */
      #dr-plist {
        width:100%; flex-shrink:0;
        max-height:0; opacity:0; padding:0 20px 0 30px;
        overflow:hidden;
        transition:max-height .3s ease, opacity .2s ease, padding .3s ease;
      }
      #dr-plist::-webkit-scrollbar { display:none; }
      #dr-plist.expanded {
        max-height:120px; opacity:1;
        padding:8px 20px 10px 30px;
        overflow-x:auto; overflow-y:hidden;
        border-bottom:1px solid rgba(0,0,0,.06);
      }
      #dr-plist ul { display:flex; flex-direction:row; gap:20px; white-space:nowrap; }
      #dr-plist li { margin:0; }
      #dr-plist a { white-space:nowrap; overflow:visible; text-overflow:clip; }

      /* Main + panels */
      #dr-main { flex:1; min-height:0; }
      #dr-topbtn { top:8px; right:14px; font-size:14px; padding:6px 8px; }
      #dr-list, #dr-detail { padding:44px 20px 40px 30px; }

      /* Index cards */
      .dl-card { margin-bottom:40px; }
      .dl-strip { height:48vw; }
      .dl-meta { grid-template-columns:1fr 1fr; gap:6px 16px; font-size:13px; }
      .dl-meta .dl-cats { grid-column:1 / -1; }

      /* Detail: stacked full-width images + wrapped meta */
      .dv-head { grid-template-columns:1fr 1fr; gap:14px; }
      .dv-title-col { grid-column:1 / -1; }
      .dv-desc { display:block; }
      .dv-imgs-top { margin-bottom:18px; }
      .dv-imgs-rest { margin-top:18px; }

      /* Lightbox: touch-friendly */
      #lb-counter { font-size:13px; bottom:20px; }
    }
  </style>
</head>
<body>

<!-- ══ HOME VIEW ══ -->
<div id="home-view">
  <div class="r-corner"></div>
  <div class="r-top" id="rtop">

function drawH(svg) {
  var w = svg.clientWidth, s = '';
  for (var x = 0; x <= w; x += 30) {
    var maj = x % 90 === 0, th = maj ? 8 : (x % 60 === 0 ? 5 : 3);
    s += '<line x1="'+x+'" y1="'+(15-th)+'" x2="'+x+'" y2="15" stroke="#b8b8b8" stroke-width=".5"/>';
  }
  svg.innerHTML = s;
}
function drawV(svg) {
  var h = svg.clientHeight, s = '';
  for (var y = 0; y <= h; y += 30) {
    var maj = y % 90 === 0, tw = maj ? 8 : (y % 60 === 0 ? 5 : 3);
    s += '<line x1="'+(15-tw)+'" y1="'+y+'" x2="15" y2="'+y+'" stroke="#b8b8b8" stroke-width=".5"/>';
  }
  svg.innerHTML = s;
}

// Resolve a project's image list: p.images[] (ratio/zoom/pos/bg) first, else imgCount fallback
function projectImgList(p) {
  var list = (p.images && p.images.length)
    ? p.images.map(function(im){ return { src: '_web/' + p.folder + '/' + im.file, s: im }; })
    : [];
  if (!list.length) {
    for (var i = 1; i <= p.imgCount; i++)
      list.push({ src: '_web/' + p.folder + '/' + String(i).padStart(3,'0') + '.jpg', s: null });
  }
  return list;
}

/* ── INDEX (image-led 목차) ── */
function renderList() {
  var wrap = document.getElementById('dr-list');
  if (!wrap) return;
  stripStops.forEach(function(stop){ stop(); }); stripStops = [];
  wrap.innerHTML = '';
  filteredProjects().forEach(function(p){
    var card = document.createElement('div');
    card.className = 'dl-card';
    card.dataset.id = p.id;

    // Horizontal strip of ALL project images (auto-slide + click nav)
    var strip = document.createElement('div');
    strip.className = 'dl-strip';
    projectImgList(p).forEach(function(x){
      var cell = document.createElement('div');
      cell.className = 'dl-cell';
      var img = document.createElement('img');
      img.src = x.src; img.alt = (x.s && x.s.alt) || ''; img.loading = 'lazy';
      cell.appendChild(img);
      strip.appendChild(cell);
    });
    if (strip.children.length) { card.appendChild(strip); makeStripCarousel(strip, true); }

    // Caption row: title | type/date | client | categories (click → open detail)
    var meta = document.createElement('div');
    meta.className = 'dl-meta';
    meta.innerHTML = '<span class="dl-title"></span><span class="dl-td"></span><span class="dl-client"></span><span class="dl-cats"></span>';
    meta.querySelector('.dl-title').textContent = p.title || p.titleEn || '';
    meta.querySelector('.dl-td').textContent = [p.type || '', p.date || ''].filter(Boolean).join('\n');
    meta.querySelector('.dl-client').textContent = (p.client && p.client !== '—') ? p.client : '';
    meta.querySelector('.dl-cats').textContent = (p.categories && p.categories.length) ? p.categories.join(', ') : '';
    card.appendChild(meta);

    card.addEventListener('click', function(){ loadProject(p.id); });
    wrap.appendChild(card);
  });
  updateListSpy();
}

/* Bold the project in the left list that's currently scrolled into view */
function updateListSpy() {
  var wrap = document.getElementById('dr-list');
  if (!wrap) return;
  var cards = wrap.querySelectorAll('.dl-card');
  if (!cards.length) return;
  var mid = wrap.scrollTop + wrap.clientHeight * 0.4;
  var curId = cards[0].dataset.id;
  cards.forEach(function(c){ if (c.offsetTop <= mid) curId = c.dataset.id; });
  document.querySelectorAll('#dr-plist-ul a').forEach(function(a){
    a.classList.toggle('on', a.dataset.id === curId);
  });
}
(function(){
  var wrap = document.getElementById('dr-list');
  if (wrap) wrap.addEventListener('scroll', updateListSpy, {passive:true});
})();

  head.querySelector('.dv-title').textContent = p.title || p.titleEn || '';

  head.querySelector('.dv-client').textContent = (p.client && p.client !== '—') ? p.client : '';
  head.querySelector('.dv-cat').textContent = (p.categories && p.categories.length) ? p.categories.join(', ') : '';
  head.querySelector('.dv-field').textContent = (p.fields && p.fields.length) ? p.fields.join(', ') : '';
  var credV = head.querySelector('.dv-credit');
  (p.credits || []).filter(function(c){ return c && (c.role || c.name); }).forEach(function(c){
    var line = document.createElement('div');
    line.className = 'dv-credit-line';

    var nameEl;

    } else { nameEl = document.createElement('span'); }

  det.appendChild(head);

  // Description (KO + EN)
  var desc = document.createElement('div');
  desc.className = 'dv-desc';
  if (p.bodyKo)    { var k = document.createElement('p'); k.className = 'dv-body-ko'; k.textContent = p.bodyKo; desc.appendChild(k); }
  if (p.taglineEn) { var t = document.createElement('p'); t.className = 'dv-tagline'; t.textContent = p.taglineEn; desc.appendChild(t); }
  if (p.bodyEn)    { var e = document.createElement('p'); e.className = 'dv-body-en'; e.textContent = p.bodyEn; desc.appendChild(e); }
  det.appendChild(desc);

  showDetail();

/* ── IMAGE STRIP CAROUSELS ──
   auto=true (index): continuous marquee, paused on hover; click right/left nudges.
   auto=false (detail): steps to next/prev image on right/left click (no auto). */
function isMobile() { return window.innerWidth <= 768; }

var stripStops = [];  // cleanup fns for running marquees

// Springy ease with a little overshoot/rebound ("쫀득")
function easeOutBack(t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

// Tween an element's scrollLeft to `to` with easeOutBack (done fires on natural completion)
function animateScroll(el, to, dur, done) {
  if (el._raf) cancelAnimationFrame(el._raf);
  var from = el.scrollLeft, start = 0;
  function step(ts) {
    if (!start) start = ts;
    var t = Math.min(1, (ts - start) / dur);
    el.scrollLeft = from + (to - from) * easeOutBack(t);
    if (t < 1) el._raf = requestAnimationFrame(step);
    else if (done) done();
  }
  el._raf = requestAnimationFrame(step);
}

// Pointer faces left/right depending on which half of the strip the cursor is over.
function attachHalfCursor(strip) {
  strip.addEventListener('pointermove', function(e){
    var r = strip.getBoundingClientRect();
    strip.style.cursor = (e.clientX - r.left > r.width / 2) ? 'var(--cur-right)' : 'var(--cur-left)';
  });
  strip.addEventListener('pointerleave', function(){ strip.style.cursor = ''; });
}

function makeStripCarousel(strip, auto) {
  var cells = strip.querySelectorAll('.dl-cell');
  if (!cells.length) return;
  if (auto) { makeMarquee(strip, cells.length); return; }

  // Detail: seamless looped carousel (right half → next, left half → prev) with springy ease
  var N = cells.length;
  if (N > 1) Array.prototype.slice.call(cells).forEach(function(c){ strip.appendChild(c.cloneNode(true)); });
  var all = strip.querySelectorAll('.dl-cell');
  var ri = 0;
  function half(){ return strip.scrollWidth / 2; }
  function normalize(){
    if (ri >= N) { ri -= N; strip.scrollLeft -= half(); }
    else if (ri < 0) { ri += N; strip.scrollLeft += half(); }
  }
  function go(dir){
    if (N < 2) return;
    normalize();
    ri += dir;
    if (ri < 0) { strip.scrollLeft += half(); ri += N; }   // jump into the clone set for a seamless prev
    animateScroll(strip, all[ri].offsetLeft, 560, normalize);
  }
  strip.addEventListener('click', function(e){
    if (N < 2) return;
    e.stopPropagation();
    var r = strip.getBoundingClientRect();
    go(e.clientX - r.left > r.width / 2 ? 1 : -1);
  });
  attachHalfCursor(strip);
}

// Seamless marquee: cells move into a track that we translateX continuously (GPU-accelerated,
// no sub-pixel scroll jitter). Track is duplicated so it wraps at the half point.
function makeMarquee(strip, origCount) {
  var track = document.createElement('div');
  track.className = 'dl-track';
  while (strip.firstChild) track.appendChild(strip.firstChild);
  Array.prototype.slice.call(track.children).forEach(function(c){ track.appendChild(c.cloneNode(true)); });
  strip.appendChild(track);

  var x = 0, hovering = false, dragging = false, moved = false, downX = 0, startTx = 0, last = 0, raf = 0;
  var SPEED = 110; // px per second
  function render() { track.style.transform = 'translate3d(' + x + 'px,0,0)'; }
  function wrap() {
    var half = track.scrollWidth / 2;
    if (half <= 0) return;
    if (x <= -half) x += half; else if (x > 0) x -= half;
  }

  // Custom dot cursor (filled, blend-inverted; red while pressed) that follows the pointer
  var dot = document.getElementById('dragdot');
  var mainEl = document.getElementById('dr-main');
  function placeDot(e){ var r = mainEl.getBoundingClientRect(); dot.style.left = (e.clientX - r.left) + 'px'; dot.style.top = (e.clientY - r.top) + 'px'; }

  strip.addEventListener('mouseenter', function(){ hovering = true; });
  strip.addEventListener('mouseleave', function(){ hovering = false; });

  strip.addEventListener('pointerenter', function(e){ dot.style.display = 'block'; placeDot(e); });
  // Click-and-drag to scrub left/right (dot turns red); a plain click opens the detail.
  strip.addEventListener('pointerdown', function(e){
    dragging = true; moved = false; downX = e.clientX; startTx = x;
    dot.classList.add('pressed');
    try { strip.setPointerCapture(e.pointerId); } catch(_) {}
  });
  strip.addEventListener('pointermove', function(e){
    placeDot(e);
    if (!dragging) return;
    var dx = e.clientX - downX;
    if (Math.abs(dx) > 4) moved = true;
    x = startTx + dx; wrap(); render();
  });
  function endDrag(e){ if (!dragging) return; dragging = false; dot.classList.remove('pressed'); try { strip.releasePointerCapture(e.pointerId); } catch(_) {} }
  strip.addEventListener('pointerup', endDrag);
  strip.addEventListener('pointercancel', endDrag);
  strip.addEventListener('pointerleave', function(){ dot.style.display = 'none'; dot.classList.remove('pressed'); });
  // If it was a drag (not a plain click), swallow the click so it doesn't open the detail page.
  strip.addEventListener('click', function(e){
    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
  }, true);

  function tick(ts) {
    if (!last) last = ts;
    var dt = (ts - last) / 1000; last = ts;
    if (!hovering && !dragging && document.getElementById('drawer').classList.contains('open')) {
      x -= SPEED * dt; wrap(); render();
    }
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);
  stripStops.push(function(){ cancelAnimationFrame(raf); });
}

/* ── TYPING ANIMATION ── */
window.addEventListener('load', function(){
  var SPEED = 7; // ms per char

  // dt1 sequence is read straight from the #dt1 markup — edit ONLY the HTML.
  // Text nodes → typed chars; .hidden-ink spans → hidden-ink chars.
  function readChars(el) {
    var out = [];
    for (var n = el.firstChild; n; n = n.nextSibling) {
      var txt = n.textContent || '';
      var hidden = (n.nodeType === 1 && n.classList && n.classList.contains('hidden-ink'));
      for (var i = 0; i < txt.length; i++) out.push(hidden ? { h: txt[i] } : txt[i]);
    }
    return out;
  }

  function typeCustom(el, chars, spd, done) {
    el.style.opacity = '1';
    el.innerHTML = '';
    var i = 0;
    function step() {
      if (i >= chars.length) { if (done) done(); return; }
      var c = chars[i++];
      if (c && typeof c === 'object') {
        var sp = document.createElement('span');
        sp.className = 'hidden-ink'; sp.textContent = c.h;
        el.appendChild(sp);
      } else {
        el.appendChild(document.createTextNode(c));
      }
      setTimeout(step, spd);
    }
    step();
  }

  function typeText(el, text, spd, done) {
    el.style.opacity = '1';
    el.innerHTML = '';
    var i = 0;
    function step() {
      if (i >= text.length) { if (done) done(); return; }
      var ch = text[i++];
      if (ch === '\n') {
        el.appendChild(document.createElement('br'));
      } else {
        var last = el.lastChild;
        if (last && last.nodeType === 3) { last.textContent += ch; }
        else { el.appendChild(document.createTextNode(ch)); }
      }
      setTimeout(step, spd);
    }
    step();
  }

  var block = document.getElementById('home-block');
  var dt1 = document.getElementById('dt1');
  var dt2 = document.getElementById('dt2');
  var menu = document.getElementById('home-menu');

  // ── Split text into per-word spans, then make each word individually draggable ──
  function splitIntoWords(el) {
    var nodes = Array.prototype.slice.call(el.childNodes);
    el.textContent = '';
    var word = null, buf = '';
    function mkWord() { if (!word) { word = document.createElement('span'); word.className = 'word'; } return word; }
    function commitBuf() { if (buf) { mkWord().appendChild(document.createTextNode(buf)); buf = ''; } }
    function flush() { commitBuf(); if (word) { el.appendChild(word); word = null; } }
    nodes.forEach(function(n){
      if (n.nodeType === 1 && n.tagName === 'BR') { flush(); el.appendChild(n); return; }
      if (n.nodeType === 1) { commitBuf(); mkWord().appendChild(n); return; } // e.g. .hidden-ink → part of word
      var t = n.textContent || '';
      for (var i = 0; i < t.length; i++) {
        if (t[i] === ' ') { flush(); el.appendChild(document.createTextNode(' ')); }
        else buf += t[i];
      }
    });
    flush();
  }

  var dCur = null, dsx = 0, dsy = 0, dox = 0, doy = 0, dMoved = false, homeDragged = false;
  window.addEventListener('mousemove', function(e){
    if (!dCur) return;
    var dx = e.clientX - dsx, dy = e.clientY - dsy;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dMoved = true;
    var nx = dox + dx, ny = doy + dy;
    dCur.dataset.dx = nx; dCur.dataset.dy = ny;
    dCur.style.transform = 'translate(' + nx + 'px,' + ny + 'px)';
  });
  window.addEventListener('mouseup', function(){
    if (!dCur) return;
    dCur.style.zIndex = ''; dCur = null;
    homeDragged = dMoved;
    setTimeout(function(){ homeDragged = false; }, 0);
  });
  function makeWordDrag(el) {
    el.classList.add('word');
    el.addEventListener('mousedown', function(e){
      dCur = el; dMoved = false;
      dsx = e.clientX; dsy = e.clientY;
      dox = parseFloat(el.dataset.dx || 0); doy = parseFloat(el.dataset.dy || 0);
      el.style.zIndex = '5';
      e.preventDefault(); e.stopPropagation();
    });
  }
  // If a menu link was dragged (not just clicked), swallow the click so it doesn't navigate/open.
  menu.addEventListener('click', function(e){
    if (homeDragged) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  function splitAllWords() {
    var dt3 = document.getElementById('dt3');
    splitIntoWords(dt1);
    splitIntoWords(dt2);
    if (dt3) splitIntoWords(dt3);
    dt1.querySelectorAll('.word').forEach(makeWordDrag);
    dt2.querySelectorAll('.word').forEach(makeWordDrag);
    if (dt3) dt3.querySelectorAll('.word').forEach(makeWordDrag);
    menu.querySelectorAll('a').forEach(makeWordDrag);
  }

  setTimeout(function(){
    block.style.opacity = '1';
    typeCustom(dt1, readChars(dt1), SPEED * 2, function(){
      typeText(dt2,
        'ordk is a designer who assembles messages into visual systems. Working across branding, graphic, and visual design, ordk builds structured and intentional identities grounded in real-world context and hands-on experience.\nMake a grid. Move your mouse. Click to keep.',
        SPEED, function(){
          menu.style.transition = 'opacity .5s';
          menu.style.opacity = '1';
          splitAllWords();
        });
    });
  }, 300);
});

/* ── MOUSE TRAIL IMAGES ── */
(function(){
  var pool = [
    '_web/Hotel GOYO/001.jpg','_web/Hotel GOYO/002.jpg','_web/Hotel GOYO/003.jpg',
    '_web/Hotel GOYO/005.jpg','_web/Hotel GOYO/007.jpg','_web/Hotel GOYO/009.jpg',
    '_web/dotdotdot/001.jpg','_web/dotdotdot/002.jpg','_web/dotdotdot/003.jpg',
    '_web/dotdotdot/005.jpg','_web/dotdotdot/007.jpg'
  ];

  function shuffle(a) {
    var b = a.slice();
    for (var i = b.length-1; i > 0; i--) {
      var j = Math.floor(Math.random()*(i+1)), t = b[i]; b[i]=b[j]; b[j]=t;
    }
    return b;
  }

  var deck = shuffle(pool), deckIdx = 0;
  function nextSrc() {
    if (deckIdx >= deck.length) { deck = shuffle(pool); deckIdx = 0; }
    return deck[deckIdx++];
  }

  var lastX = -9999, lastY = -9999;
  var MIN_DIST = 160;
  var LIFE = 1000; // ms before fade

  document.getElementById('home-view').addEventListener('mousemove', function(e) {
    if (document.getElementById('drawer').classList.contains('open')) return;

    var canvas = document.getElementById('canvas');
    var r = canvas.getBoundingClientRect();
    var cx = e.clientX - r.left;
    var cy = e.clientY - r.top;

    // exclude left text/menu zone
    if (cx < 320) return;

    var d = Math.sqrt((cx-lastX)*(cx-lastX)+(cy-lastY)*(cy-lastY));
    if (d < MIN_DIST) return;
    lastX = cx; lastY = cy;

    var w = 160 + Math.floor(Math.random()*100); // 160-260px
    var rot = (Math.random()*8 - 4).toFixed(1);  // -4° to +4°

    var img = document.createElement('img');
    img.className = 'trail-img';
    img.src = nextSrc();
    img.style.left = cx + 'px';
    img.style.top  = cy + 'px';
    img.style.width = w + 'px';
    img.style.transform = 'translate(-50%,-50%) rotate('+rot+'deg)';
    canvas.appendChild(img);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ img.classList.add('visible'); });
    });

    var kept = false;
    var fadeTimer = setTimeout(function(){
      if (kept) return;
      img.style.transition = 'opacity .45s ease';
      img.classList.remove('visible');
      setTimeout(function(){ if (img.parentNode) img.parentNode.removeChild(img); }, 450);
    }, LIFE);

    img.addEventListener('click', function(e) {
      e.stopPropagation();
      kept = true;
      clearTimeout(fadeTimer);
      img.style.transition = 'none';
      img.style.opacity = '1';
      img.classList.add('kept');
    });
  });
})();

/* ── EMAIL: copy address to clipboard ── */
(function(){
  var el = document.getElementById('email-copy');
  if (!el) return;
  var LABEL = el.textContent;
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
  }
  function feedback(){
    el.textContent = 'copied!';
    clearTimeout(el._resetT);
    el._resetT = setTimeout(function(){ el.textContent = LABEL; }, 1200);
  }
  el.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    var addr = el.dataset.email;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(addr).then(feedback, function(){ fallbackCopy(addr); feedback(); });
    } else {
      fallbackCopy(addr); feedback();
    }
  });
})();
